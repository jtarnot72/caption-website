<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a lobby on Caption</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0A0A0B; color: #FAFAFA;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  main { max-width: 22rem; text-align: center; }
  .mark { width: 64px; height: 64px; border-radius: 16px; background: #C4F042; margin: 0 auto 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { color: #A1A1AA; margin: 0 0 24px; }
  .code {
    font: 700 2rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .3em; padding: 16px 8px 16px 20px;
    background: #18181B; border-radius: 14px; margin-bottom: 24px;
  }
  a.btn {
    display: block; padding: 14px; border-radius: 999px;
    background: #C4F042; color: #18181B; font-weight: 700; text-decoration: none;
  }
  small { display: block; margin-top: 20px; color: #71717A; }
</style>
<main>
  <div class="mark"></div>
  <h1>You have been invited to a lobby</h1>
  <p>Open Caption and enter this code to join.</p>
  <div class="code" id="code">------</div>
  <a class="btn" id="open" href="#">Open Caption</a>
  <small>Do not have the app yet? Install Caption, then enter the code above.</small>
</main>
<script>
  /*
   * The code arrives as ?c=ABC123 rather than in the path, because GitHub Pages serves static files
   * only -- there is no server to route /join/ABC123 to this page.
   */
  var code = (new URLSearchParams(location.search).get('c') || '').toUpperCase().slice(0, 6);
  if (code) {
    document.getElementById('code').textContent = code;
    document.getElementById('open').href = 'caption://join/' + encodeURIComponent(code);
  }
</script>
